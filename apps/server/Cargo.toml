[package]
name = "remote-claude-server"
version = "1.2.2"
edition = "2021"

[dependencies]
# async runtime
tokio = { version = "1.54.1", features = ["full"] }

# web framework
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }

# serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# auth
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
argon2 = { version = "0.6.0" }

# database
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "chrono"] }

# utilities
uuid = { version = "1.29.0", features = ["v4"] }
chrono = "0.4.45"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
getrandom = { version = "0.4.3", features = ["std"] }
futures-util = "0.3.34"
toml = "1.1.8"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
